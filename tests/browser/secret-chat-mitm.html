<!doctype html><html><head><meta charset="utf-8"><title>Secret Chat man-in-the-middle test</title></head><body style="font:14px system-ui,sans-serif;margin:16px">
<h1 style="font-size:18px">Secret Chat: man-in-the-middle test</h1>
<p>Run from the repo root with <code>python3 -m http.server</code> and open <code>/tests/browser/secret-chat-mitm.html</code>. Mallory (this page) intercepts both links and relays every message. The chat works, but the safety codes must differ.</p>
<pre id="result">Running…</pre>
<iframe id="alice" width="600" height="600"></iframe><iframe id="bob" width="600" height="600"></iframe>
<script src="/linkplay/linkplay.js"></script>
<script>
const lines = [], out = m => { lines.push(m); document.getElementById('result').textContent = lines.join('\n'); }, wait = ms => new Promise(r => setTimeout(r, ms));
const report = () => { document.title = 'done'; fetch('/done?' + encodeURIComponent(lines.join(' | '))).catch(() => {}); };
setTimeout(() => { out('TIMEOUT'); report(); }, 60000);
const load = (id, url) => new Promise(r => { const f = document.getElementById(id); f.onload = () => r(f.contentWindow); f.src = url; });
const until = async (fn, ms = 20000) => { const t = Date.now(); while (Date.now() - t < ms) { try { const v = fn(); if (v) return v; } catch (e) { } await wait(100); } return null; };
const type = (w, text) => { const i = w.document.getElementById('input'); i.value = text; i.dispatchEvent(new w.Event('input')); w.document.getElementById('send').click(); };
const code = w => w.document.getElementById('sasWords').textContent + ' ' + w.document.getElementById('sasDigits').textContent;
(async () => {
  try {
    // Alice starts a chat and sends her invite. Mallory intercepts it.
    const alice = await load('alice', '/secret-chat/');
    alice.document.getElementById('startBtn').click();
    const inviteA = await until(() => alice.document.getElementById('offerLink').value);
    let toAlice = null, toBob = null;
    const seen = [];
    const mA = await LinkPlay.join('mitm-a', LinkPlay.fromHash('#' + inviteA.split('#')[1]), {
      onChannel: ch => { toAlice = ch; ch.onmessage = e => { seen.push('A>' + e.data.slice(0, 80)); if (toBob) toBob.send(e.data); }; },
    });
    // Mallory makes her own invite and sends that to Bob, as if it were Alice's.
    const mHost = LinkPlay.host('mitm-b', {
      onChannel: ch => { toBob = ch; ch.onmessage = e => { seen.push('B>' + e.data.slice(0, 80)); if (toAlice) toAlice.send(e.data); }; },
    });
    const inviteM = (await mHost.invite()).link;
    const bob = await load('bob', '/secret-chat/#' + inviteM.split('#')[1]);
    const replyB = await until(() => bob.document.getElementById('answerLink').value);
    out('Mallory accepts Bob\'s reply: ' + ((await mHost.accept(replyB)) === '' ? 'ok' : 'failed'));
    // Mallory sends Alice her own reply, as if it were Bob's.
    const replyM = mA.link.replace(location.pathname, '/secret-chat/');
    alice.document.getElementById('replyIn').value = replyM;
    alice.document.getElementById('connectBtn').click();
    out('both think they are connected: ' + !!await until(() => !alice.document.getElementById('chat').hidden && !bob.document.getElementById('chat').hidden && toAlice && toBob));
    await wait(800);
    type(alice, 'the wifi password is Harbor-7731');
    const relayed = await until(() => [...bob.document.querySelectorAll('#log .msg')].some(m => m.textContent.includes('Harbor-7731')));
    out('message reached Bob through Mallory: ' + !!relayed);
    out('Mallory could read it: ' + seen.some(s => s.includes('Harbor-7731')));
    const ca = await until(() => code(alice).trim()), cb = await until(() => code(bob).trim());
    out('Alice sees: ' + ca);
    out('Bob sees: ' + cb);
    out('SAFETY CODES DIFFER (attack detected): ' + (ca !== cb));
  } catch (e) { out('ERROR ' + e.message); }
  report();
})();
</script></body></html>
