<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237f8cff'/%3E%3Ctext x='16' y='23' font-family='Arial,Helvetica,sans-serif' font-weight='800' font-size='20' text-anchor='middle' fill='%2316160f'%3EU%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>Unit Converter</title>
<style>
  :root { --bg:#0b0e16; --panel:#121726; --line:#232c45; --text:#dde4f5; --dim:#7684a8; --blue:#7f8cff; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         background:var(--bg); color:var(--text); font-family:ui-monospace,'Cascadia Code','Courier New',monospace;
         padding:40px 16px; }
  a.back { position:fixed; top:12px; left:14px; color:var(--dim); font-size:12px; text-decoration:none; }
  h1 { font-size:18px; letter-spacing:4px; color:var(--blue); margin:0 0 20px; text-shadow:0 0 14px rgba(127,140,255,.5); }
  #tabs { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-bottom:24px; }
  #tabs button { background:var(--panel); color:var(--dim); border:1px solid var(--line); border-radius:16px;
                 padding:6px 14px; font:inherit; font-size:12px; cursor:pointer; }
  #tabs button.active { color:var(--blue); border-color:var(--blue); box-shadow:0 0 10px -2px var(--blue); }
  #conv { display:flex; gap:12px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .side { display:flex; flex-direction:column; gap:8px; }
  input[type=number], input[type=text] { width:200px; background:var(--panel); color:var(--text);
         border:1px solid var(--line); border-radius:8px; padding:12px; font:inherit; font-size:18px; outline:none; }
  input:focus { border-color:var(--blue); }
  select { width:200px; background:var(--panel); color:var(--text); border:1px solid var(--line);
           border-radius:8px; padding:8px; font:inherit; font-size:13px; }
  #swap { background:var(--panel); color:var(--blue); border:1px solid var(--blue); border-radius:50%;
          width:44px; height:44px; font-size:18px; cursor:pointer; }
  #all { margin-top:32px; width:min(560px,94vw); }
  #all h2 { font-size:11px; letter-spacing:2px; color:var(--dim); font-weight:400; }
  #all table { width:100%; border-collapse:collapse; font-size:13px; }
  #all td { padding:6px 10px; border-bottom:1px solid var(--line); }
  #all td:first-child { color:var(--dim); }
  #all td:last-child { text-align:right; color:#8affc9; }
</style>
<meta property="og:title" content="Unit Converter">
<meta property="og:description" content="Two-way conversion across 8 categories, plus a live table of the value in every unit.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rajeshrenato.github.io/playground/unit-converter/">
<meta property="og:image" content="https://rajeshrenato.github.io/playground/unit-converter/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="Two-way conversion across 8 categories, plus a live table of the value in every unit.">
</head>
<body>
<a class="back" href="../">&larr; all projects</a>
<h1>UNIT CONVERTER</h1>
<div id="tabs"></div>
<div id="conv">
  <div class="side">
    <input type="number" id="fromVal" value="1" step="any">
    <select id="fromUnit"></select>
  </div>
  <button id="swap" title="swap">⇄</button>
  <div class="side">
    <input type="number" id="toVal" step="any">
    <select id="toUnit"></select>
  </div>
</div>
<div id="all"><h2>ALL UNITS</h2><table id="allT"></table></div>
<script>
'use strict';
const $ = id => document.getElementById(id);

const CATS = {
  length: { m: 1, km: 1000, cm: 0.01, mm: 0.001, mi: 1609.344, yd: 0.9144, ft: 0.3048, in: 0.0254, 'nautical mi': 1852 },
  mass: { kg: 1, g: 0.001, mg: 1e-6, tonne: 1000, lb: 0.45359237, oz: 0.028349523125, stone: 6.35029318 },
  temperature: 'special',
  data: { B: 1, KB: 1e3, MB: 1e6, GB: 1e9, TB: 1e12, KiB: 1024, MiB: 1048576, GiB: 1073741824, TiB: 1099511627776 },
  speed: { 'm/s': 1, 'km/h': 1 / 3.6, mph: 0.44704, knot: 0.514444, 'ft/s': 0.3048 },
  time: { s: 1, ms: 0.001, min: 60, h: 3600, day: 86400, week: 604800, month: 2629800, year: 31557600 },
  area: { 'm²': 1, 'km²': 1e6, 'cm²': 1e-4, hectare: 1e4, acre: 4046.8564224, 'ft²': 0.09290304, 'mi²': 2589988.110336 },
  volume: { L: 1, mL: 0.001, 'm³': 1000, 'gal (US)': 3.785411784, quart: 0.946352946, pint: 0.473176473, cup: 0.2365882365, 'fl oz': 0.0295735295625 },
};
const TEMPS = ['°C', '°F', 'K'];

function toC(v, u) { return u === '°C' ? v : u === '°F' ? (v - 32) * 5 / 9 : v - 273.15; }
function fromC(v, u) { return u === '°C' ? v : u === '°F' ? v * 9 / 5 + 32 : v + 273.15; }

function convert(cat, from, to, v) {
  if (cat === 'temperature') return fromC(toC(v, from), to);
  const u = CATS[cat];
  return v * u[from] / u[to];
}

function unitsOf(cat) { return cat === 'temperature' ? TEMPS : Object.keys(CATS[cat]); }

function fmt(v) {
  if (!isFinite(v)) return '—';
  if (v === 0) return '0';
  const a = Math.abs(v);
  if (a >= 1e9 || a < 1e-6) return v.toExponential(6).replace(/\.?0+e/, 'e');
  return String(+v.toPrecision(10));
}

let cat = 'length';

function buildTabs() {
  const t = $('tabs');
  t.innerHTML = '';
  for (const c of Object.keys(CATS)) {
    const b = document.createElement('button');
    b.textContent = c;
    b.classList.toggle('active', c === cat);
    b.addEventListener('click', () => { cat = c; buildTabs(); buildUnits(); recalc('from'); });
    t.appendChild(b);
  }
}

function buildUnits() {
  const us = unitsOf(cat);
  for (const [sel, def] of [['fromUnit', 0], ['toUnit', 1]]) {
    const el = $(sel);
    el.innerHTML = '';
    us.forEach((u, i) => {
      const o = document.createElement('option');
      o.value = u; o.textContent = u;
      if (i === (def === 0 ? 0 : Math.min(1, us.length - 1))) o.selected = true;
      el.appendChild(o);
    });
  }
}

function recalc(src) {
  const from = $('fromUnit').value, to = $('toUnit').value;
  if (src === 'from') {
    const v = parseFloat($('fromVal').value);
    $('toVal').value = isNaN(v) ? '' : fmt(convert(cat, from, to, v));
  } else {
    const v = parseFloat($('toVal').value);
    $('fromVal').value = isNaN(v) ? '' : fmt(convert(cat, to, from, v));
  }
  allTable();
}

function allTable() {
  const v = parseFloat($('fromVal').value);
  const from = $('fromUnit').value;
  const t = $('allT');
  if (isNaN(v)) { t.innerHTML = ''; return; }
  t.innerHTML = unitsOf(cat).map(u =>
    '<tr><td>' + u + '</td><td>' + fmt(convert(cat, from, u, v)) + '</td></tr>').join('');
}

$('fromVal').addEventListener('input', () => recalc('from'));
$('toVal').addEventListener('input', () => recalc('to'));
$('fromUnit').addEventListener('change', () => recalc('from'));
$('toUnit').addEventListener('change', () => recalc('from'));
$('swap').addEventListener('click', () => {
  const fu = $('fromUnit').value, tu = $('toUnit').value;
  $('fromUnit').value = tu; $('toUnit').value = fu;
  $('fromVal').value = $('toVal').value;
  recalc('from');
});

buildTabs();
buildUnits();
recalc('from');
</script>
</body>
</html>
