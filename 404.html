<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff4fa3'/%3E%3Ctext x='16' y='23' font-family='Arial,Helvetica,sans-serif' font-weight='800' font-size='20' text-anchor='middle' fill='%2316160f'%3EP%3C/text%3E%3C/svg%3E">
<title>Page not found</title>
<style>
  :root { --paper: #f3f3ee; --ink: #1a1a18; --muted: #6e6e66; }
  @media (prefers-color-scheme: dark) { :root { --paper: #121214; --ink: #e8e8e2; --muted: #96968e; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
         font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 20px; }
  main { max-width: 34rem; }
  h1 { margin: 0 0 8px; font-size: 32px; }
  p { color: var(--muted); font-size: 17px; line-height: 1.5; margin: 0 0 20px; }
  a { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>There's nothing at this address. If you followed a link to a game, it may have been renamed.</p>
  <a href="/playground/">See everything in the playground</a>
</main>
</body>
</html>
