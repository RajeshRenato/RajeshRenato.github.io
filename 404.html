<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff4fa3'/%3E%3Ctext x='16' y='23' font-family='Arial,Helvetica,sans-serif' font-weight='800' font-size='20' text-anchor='middle' fill='%2316160f'%3EP%3C/text%3E%3C/svg%3E">
<title>Page not found</title>
<meta name="robots" content="noindex">
<style>
  :root { --paper: #f3f3ee; --ink: #1a1a18; --muted: #6e6e66; --card: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --paper: #121214; --ink: #e8e8e2; --muted: #96968e; --card: #1b1b1f; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
         font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 20px; }
  main { max-width: 36rem; width: 100%; }
  h1 { margin: 0 0 8px; font-size: 32px; }
  p { color: var(--muted); font-size: 17px; line-height: 1.5; margin: 0 0 18px; }
  a { color: var(--ink); font-weight: 600; }
  form { display: flex; gap: 8px; margin: 0 0 22px; }
  input { flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 10px 14px; border-radius: 10px; border: 1.5px solid var(--ink);
          background: var(--card); color: var(--ink); }
  button { font: inherit; font-weight: 600; font-size: 16px; padding: 10px 16px; border-radius: 10px; border: 1.5px solid var(--ink);
           background: var(--ink); color: var(--paper); cursor: pointer; }
  ul { list-style: none; padding: 0; margin: 0 0 22px; display: flex; flex-wrap: wrap; gap: 8px 16px; }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p id="msg">There's nothing at this address. Search for what you were looking for, or pick something below.</p>
  <form action="/" method="get" role="search">
    <input name="q" id="q" placeholder="Search, like &quot;pdf&quot; or &quot;chess&quot;" aria-label="Search the playground">
    <button>Search</button>
  </form>
  <ul>
    <li><a href="/chess/">Chess</a></li>
    <li><a href="/ludo/">Ludo</a></li>
    <li><a href="/clue-grid/">Clue Grid</a></li>
    <li><a href="/pdf-toolkit/">PDF Toolkit</a></li>
    <li><a href="/images-to-pdf/">Images to PDF</a></li>
    <li><a href="/photo-privacy/">Photo Privacy</a></li>
    <li><a href="/miami-nights/">Miami Nights</a></li>
    <li><a href="/daily/">Daily puzzles</a></li>
  </ul>
  <a href="/">See everything in the playground</a>
</main>
<script>
(() => {
  // the site used to live under /playground/, and two projects were renamed after they went public
  const MOVED = { 'vicecity': 'miami-nights', 'road-rash': 'midnight-racing' };
  let parts = location.pathname.split('/').filter(Boolean);
  const wasOld = parts[0] === 'playground';
  if (wasOld) parts = parts.slice(1);
  const renamed = parts.length > 0 && MOVED[parts[0]];
  if (renamed) parts[0] = MOVED[parts[0]];
  if (wasOld || renamed) {
    const last = parts[parts.length - 1] || '';
    const path = '/' + parts.join('/') + (parts.length && !/\.[a-z0-9]+$/i.test(last) ? '/' : '');
    location.replace(path + location.search + location.hash);
    return;
  }
  const guess = (parts[0] || '').replace(/[-_]+/g, ' ').replace(/\.html?$/, '').trim();
  if (guess) document.getElementById('q').value = guess;
})();
</script>
</body>
</html>
