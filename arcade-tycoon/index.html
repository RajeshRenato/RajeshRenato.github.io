<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff6fb0'/%3E%3Ctext x='16' y='23' font-family='Arial,Helvetica,sans-serif' font-weight='800' font-size='20' text-anchor='middle' fill='%2316160f'%3EA%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>Arcade Tycoon</title>
<style>
  :root { --bg:#0a0618; --pink:#ff6fb0; --panel:#17122e; --line:#2b2250; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         background:radial-gradient(1000px 700px at 50% -10%, #2b1033, var(--bg));
         font-family:'Courier New',monospace; color:#e8e6f5; padding:40px 16px; }
  a.back { position:fixed; top:12px; left:14px; color:#28e0ff; font-size:12px; text-decoration:none; opacity:.7; }
  h1 { margin:0 0 4px; font-style:italic; letter-spacing:5px; color:var(--pink); text-shadow:0 0 18px var(--pink); }
  #sub { color:#7684a8; font-size:12px; margin-bottom:22px; }
  #credits { font-size:42px; color:#ffd166; text-shadow:0 0 16px rgba(255,209,102,.5); }
  #rate { color:#8affc9; font-size:14px; margin:4px 0 18px; }
  #clicker { background:var(--panel); border:2px solid var(--pink); color:var(--pink); border-radius:14px;
             padding:18px 44px; font:inherit; font-size:20px; cursor:pointer; letter-spacing:2px;
             box-shadow:0 0 24px rgba(255,111,176,.3); transition:transform .05s; margin-bottom:26px; }
  #clicker:active { transform:scale(.96); }
  #gens { display:flex; flex-direction:column; gap:10px; width:min(560px,94vw); }
  .gen { display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid var(--line);
         border-radius:10px; padding:12px 16px; }
  .gen .ico { font-size:26px; }
  .gen .info { flex:1; }
  .gen .info .nm { font-size:15px; }
  .gen .info .dt { font-size:11px; color:#7684a8; }
  .gen b.own { font-size:20px; color:#28e0ff; min-width:40px; text-align:center; }
  .gen button { background:#100c22; color:#ffd166; border:1px solid #ffd166; border-radius:8px;
                padding:10px 14px; font:inherit; font-size:13px; cursor:pointer; min-width:110px; }
  .gen button:disabled { opacity:.3; cursor:default; }
  #toast { height:20px; color:#8affc9; font-size:12px; margin-top:16px; }
  #resetBtn { margin-top:14px; background:none; border:none; color:#55506e; font:inherit; font-size:11px;
              cursor:pointer; text-decoration:underline; }
</style>
<meta property="og:title" content="Arcade Tycoon">
<meta property="og:description" content="Idle arcade empire that keeps earning while the tab is closed.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rajeshrenato.github.io/playground/arcade-tycoon/">
<meta property="og:image" content="https://rajeshrenato.github.io/playground/arcade-tycoon/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="Idle arcade empire that keeps earning while the tab is closed.">
</head>
<body>
<a class="back" href="../">&larr; all projects</a>
<h1>ARCADE TYCOON</h1>
<div id="sub">build the greatest synthwave arcade empire in the galaxy</div>
<div id="credits">0 ₢</div>
<div id="rate">0 ₢/s</div>
<button id="clicker">INSERT COIN  +<span id="clickPow">1</span></button>
<div id="gens"></div>
<div id="toast"></div>
<button id="resetBtn">hard reset</button>
<script>
'use strict';
const $ = id => document.getElementById(id);

const GENS = [
  { id: 'cab', ico: '🕹️', name: 'Arcade Cabinet', base: 15, rate: 0.1 },
  { id: 'snack', ico: '🌭', name: 'Snack Bar', base: 100, rate: 1 },
  { id: 'vr', ico: '🥽', name: 'VR Pod', base: 1100, rate: 8 },
  { id: 'sign', ico: '🌆', name: 'Neon Sign Factory', base: 12000, rate: 47 },
  { id: 'elev', ico: '🚀', name: 'Space Elevator', base: 130000, rate: 260 },
];

let S = { credits: 0, owned: {}, clicks: 0, clickLvl: 0, lastSeen: Date.now() };

function cost(g, n) { return Math.ceil(g.base * Math.pow(1.15, n)); }
function clickPower() { return Math.pow(2, S.clickLvl); }
function clickUpCost() { return 50 * Math.pow(6, S.clickLvl); }
function totalRate() {
  return GENS.reduce((sum, g) => sum + g.rate * (S.owned[g.id] || 0), 0);
}

function fmt(n) {
  if (n < 1000) return n < 100 ? +n.toFixed(1) + '' : Math.floor(n) + '';
  const units = ['K', 'M', 'B', 'T', 'Qa'];
  let u = -1;
  while (n >= 1000 && u < units.length - 1) { n /= 1000; u++; }
  return n.toFixed(n < 100 ? 1 : 0) + units[u];
}

function buy(id) {
  const g = GENS.find(x => x.id === id);
  const n = S.owned[id] || 0;
  const c = cost(g, n);
  if (S.credits < c) return false;
  S.credits -= c;
  S.owned[id] = n + 1;
  save();
  render();
  return true;
}

function buyClick() {
  const c = clickUpCost();
  if (S.credits < c) return false;
  S.credits -= c;
  S.clickLvl++;
  save();
  render();
  return true;
}

function save() {
  S.lastSeen = Date.now();
  try { localStorage.setItem('tycoon', JSON.stringify(S)); } catch (e) { }
}

function load() {
  try {
    const raw = localStorage.getItem('tycoon');
    if (raw) Object.assign(S, JSON.parse(raw));
  } catch (e) { }
  // offline earnings, capped at 8 hours
  const away = Math.min(8 * 3600, Math.max(0, (Date.now() - S.lastSeen) / 1000));
  const earned = totalRate() * away;
  if (earned >= 1) {
    S.credits += earned;
    $('toast').textContent = 'while you were away the arcade earned ' + fmt(earned) + ' ₢';
  }
}

function buildGens() {
  const box = $('gens');
  box.innerHTML = '';
  for (const g of GENS) {
    const row = document.createElement('div');
    row.className = 'gen';
    row.innerHTML = '<span class="ico">' + g.ico + '</span>' +
      '<span class="info"><div class="nm">' + g.name + '</div>' +
      '<div class="dt">' + fmt(g.rate) + ' ₢/s each</div></span>' +
      '<b class="own" id="own_' + g.id + '">0</b>' +
      '<button id="buy_' + g.id + '"></button>';
    box.appendChild(row);
    row.querySelector('button').addEventListener('click', () => buy(g.id));
  }
  const up = document.createElement('div');
  up.className = 'gen';
  up.innerHTML = '<span class="ico">👆</span>' +
    '<span class="info"><div class="nm">Golden Thumb</div><div class="dt">doubles coin per click</div></span>' +
    '<b class="own" id="own_click">x1</b><button id="buy_click"></button>';
  box.appendChild(up);
  up.querySelector('button').addEventListener('click', buyClick);
}

function render() {
  $('credits').textContent = fmt(S.credits) + ' ₢';
  $('rate').textContent = fmt(totalRate()) + ' ₢/s';
  $('clickPow').textContent = fmt(clickPower());
  for (const g of GENS) {
    const n = S.owned[g.id] || 0;
    $('own_' + g.id).textContent = n;
    const b = $('buy_' + g.id);
    b.textContent = 'buy ' + fmt(cost(g, n)) + ' ₢';
    b.disabled = S.credits < cost(g, n);
  }
  $('own_click').textContent = 'x' + fmt(clickPower());
  const cb = $('buy_click');
  cb.textContent = 'up ' + fmt(clickUpCost()) + ' ₢';
  cb.disabled = S.credits < clickUpCost();
}

$('clicker').addEventListener('click', () => {
  S.credits += clickPower();
  S.clicks++;
  render();
});
$('resetBtn').addEventListener('click', () => {
  S = { credits: 0, owned: {}, clicks: 0, clickLvl: 0, lastSeen: Date.now() };
  save();
  render();
  $('toast').textContent = 'empire reset. the neon never forgets.';
});

buildGens();
load();
render();
let saveT = 0;
setInterval(() => {
  S.credits += totalRate() / 10;
  render();
  if (++saveT >= 30) { saveT = 0; save(); }
}, 100);
</script>
</body>
</html>
