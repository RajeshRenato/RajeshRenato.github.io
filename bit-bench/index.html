<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237f8cff'/%3E%3Ctext x='16' y='23' font-family='Arial,Helvetica,sans-serif' font-weight='800' font-size='20' text-anchor='middle' fill='%2316160f'%3EB%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>Bit Bench</title>
<style>
  :root { --bg:#0b0e16; --panel:#121726; --line:#232c45; --blue:#7f8cff; --dim:#7684a8; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         background:var(--bg); color:#dde4f5; font-family:ui-monospace,'Cascadia Code','Courier New',monospace; padding:20px; }
  a.back { position:fixed; top:12px; left:14px; color:var(--dim); font-size:12px; text-decoration:none; }
  h1 { font-size:18px; letter-spacing:4px; color:var(--blue); margin:0 0 18px; text-shadow:0 0 14px rgba(127,140,255,.5); }
  .rows { display:flex; flex-direction:column; gap:8px; width:min(640px,94vw); margin-bottom:16px; }
  .row { display:flex; align-items:center; gap:10px; }
  .row label { width:88px; color:var(--dim); font-size:12px; text-align:right; }
  .row input { flex:1; background:var(--panel); color:#dde4f5; border:1px solid var(--line); border-radius:6px;
               padding:9px 12px; font:inherit; font-size:15px; outline:none; }
  .row input:focus { border-color:var(--blue); }
  .row input.bad { border-color:#ff5a7a; }
  #bits { display:grid; grid-template-columns:repeat(16, 1fr); gap:4px; width:min(640px,94vw); margin-bottom:6px; }
  .bit { aspect-ratio:1; display:flex; align-items:center; justify-content:center; background:var(--panel);
         border:1px solid var(--line); border-radius:4px; cursor:pointer; font-size:13px; user-select:none; }
  .bit.on { background:#2a3170; border-color:var(--blue); color:#c4cbff; box-shadow:0 0 8px rgba(127,140,255,.4); }
  #bitLbl { display:grid; grid-template-columns:repeat(16,1fr); gap:4px; width:min(640px,94vw); margin-bottom:18px;
            font-size:9px; color:#454f6e; text-align:center; }
  h2 { font-size:11px; letter-spacing:2px; color:var(--dim); font-weight:400; margin:6px 0; width:min(640px,94vw); }
  #ops { width:min(640px,94vw); border-collapse:collapse; font-size:13px; }
  #ops td { padding:6px 10px; border-bottom:1px solid var(--line); }
  #ops td:first-child { color:var(--blue); width:110px; }
  #ops td:nth-child(2) { color:#8affc9; }
  #ops td:nth-child(3) { color:var(--dim); }
  .opIn { display:flex; gap:14px; width:min(640px,94vw); margin:8px 0 4px; font-size:12px; color:var(--dim); align-items:center; }
  .opIn input { width:120px; background:var(--panel); color:#dde4f5; border:1px solid var(--line); border-radius:6px;
                padding:5px 8px; font:inherit; }
  .opIn input[type=range] { width:140px; accent-color:var(--blue); padding:0; }
</style>
<meta property="og:title" content="Bit Bench">
<meta property="og:description" content="32-bit playground: dec/hex/bin/oct in sync, clickable bits, shifts and bitwise ops live.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rajeshrenato.github.io/playground/bit-bench/">
<meta property="og:image" content="https://rajeshrenato.github.io/playground/bit-bench/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="32-bit playground: dec/hex/bin/oct in sync, clickable bits, shifts and bitwise ops live.">
</head>
<body>
<a class="back" href="../">&larr; all projects</a>
<h1>BIT BENCH</h1>
<div class="rows">
  <div class="row"><label>decimal</label><input id="dec" spellcheck="false"></div>
  <div class="row"><label>signed i32</label><input id="sig" spellcheck="false" readonly style="opacity:.75"></div>
  <div class="row"><label>hex</label><input id="hex" spellcheck="false"></div>
  <div class="row"><label>binary</label><input id="bin" spellcheck="false"></div>
  <div class="row"><label>octal</label><input id="oct" spellcheck="false"></div>
</div>
<h2>BITS: click to flip (31 to 0)</h2>
<div id="bits"></div>
<div id="bitLbl"></div>
<h2>BITWISE OPS</h2>
<div class="opIn">
  operand B <input id="opB" value="10">
  shift n <input type="range" id="shn" min="0" max="31" value="4"> <b id="shnV" style="color:#ffd166">4</b>
</div>
<table id="ops"></table>
<script>
'use strict';
const $ = id => document.getElementById(id);
let val = 0xC0FFEE >>> 0;

function parseIn(str, base) {
  str = str.trim().toLowerCase().replace(/^0x|^0b|^0o/, '').replace(/[\s_]/g, '');
  if (!str) return null;
  const RE = { 10: /^-?\d+$/, 16: /^[0-9a-f]+$/, 2: /^[01]+$/, 8: /^[0-7]+$/ };
  if (!RE[base].test(str)) return null;
  const n = parseInt(str, base);
  if (!Number.isFinite(n) || Math.abs(n) > 0xFFFFFFFF) return null;
  return n >>> 0 === (n & -1) >>> 0 ? (n >>> 0) : ((n >>> 0));
}

function fmtBin(v) {
  return (v >>> 0).toString(2).padStart(32, '0').replace(/(.{4})(?=.)/g, '$1 ');
}
function fmtHex(v) { return (v >>> 0).toString(16).toUpperCase().padStart(8, '0'); }

function setVal(v) {
  val = v >>> 0;
  renderAll();
}

function toggleBit(i) { setVal((val ^ (1 << i)) >>> 0); }

let bitEls = [];
function buildBits() {
  const box = $('bits'), lbl = $('bitLbl');
  box.innerHTML = ''; lbl.innerHTML = '';
  bitEls = [];
  for (let i = 31; i >= 0; i--) {
    const d = document.createElement('div');
    d.className = 'bit';
    d.addEventListener('click', () => toggleBit(i));
    box.appendChild(d);
    bitEls[i] = d;
    const l = document.createElement('div');
    l.textContent = i;
    lbl.appendChild(l);
  }
}

function renderBits() {
  for (let i = 0; i < 32; i++) {
    const on = (val >>> i) & 1;
    bitEls[i].textContent = on;
    bitEls[i].classList.toggle('on', !!on);
  }
}

function renderFields(skip) {
  if (skip !== 'dec') $('dec').value = (val >>> 0).toString(10);
  $('sig').value = (val | 0).toString(10);
  if (skip !== 'hex') $('hex').value = '0x' + fmtHex(val);
  if (skip !== 'bin') $('bin').value = fmtBin(val);
  if (skip !== 'oct') $('oct').value = '0o' + (val >>> 0).toString(8);
}

function renderOps() {
  const bRaw = parseIn($('opB').value, 10);
  const b = bRaw === null ? 0 : bRaw;
  const n = +$('shn').value;
  $('shnV').textContent = n;
  const rows = [
    ['A & B', (val & b) >>> 0],
    ['A | B', (val | b) >>> 0],
    ['A ^ B', (val ^ b) >>> 0],
    ['~A', (~val) >>> 0],
    ['A << ' + n, (val << n) >>> 0],
    ['A >> ' + n, (val >> n) >>> 0, '(arithmetic, sign-extending)'],
    ['A >>> ' + n, (val >>> n) >>> 0, '(logical, zero-filling)'],
  ];
  $('ops').innerHTML = rows.map(([op, v, note]) =>
    '<tr><td>' + op + '</td><td>' + v + '  ·  0x' + fmtHex(v) + '</td><td>' + (note || '') + '</td></tr>').join('');
}

function renderAll(skip) {
  renderFields(skip);
  renderBits();
  renderOps();
}

function hook(id, base) {
  $(id).addEventListener('input', () => {
    const v = parseIn($(id).value, base);
    $(id).classList.toggle('bad', v === null && $(id).value.trim() !== '');
    if (v !== null) { val = v; renderAll(id); }
  });
}
hook('dec', 10); hook('hex', 16); hook('bin', 2); hook('oct', 8);
$('opB').addEventListener('input', renderOps);
$('shn').addEventListener('input', renderOps);

buildBits();
renderAll();
</script>
</body>
</html>
