<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2328e0ff'/%3E%3Ctext x='16' y='23' font-family='Arial,Helvetica,sans-serif' font-weight='800' font-size='20' text-anchor='middle' fill='%2316160f'%3ED%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>Diff Deck</title>
<style>
  :root { --bg:#0b0e16; --panel:#121726; --line:#232c45; --text:#dde4f5; --dim:#7684a8; --cyan:#28e0ff; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text);
         font-family:ui-monospace,'Cascadia Code','Courier New',monospace; }
  header { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); }
  header a.back { color:var(--dim); font-size:12px; text-decoration:none; }
  header h1 { font-size:15px; margin:0 10px 0 0; color:var(--cyan); letter-spacing:2px; }
  header button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px;
                  padding:6px 12px; font:inherit; font-size:13px; cursor:pointer; }
  header button:hover { border-color:var(--cyan); color:var(--cyan); }
  #stats { margin-left:auto; font-size:13px; }
  #stats .add { color:#39ff9c; } #stats .del { color:#ff5a7a; }
  #inputs { display:flex; border-bottom:1px solid var(--line); }
  #inputs textarea { flex:1; height:130px; resize:vertical; border:0; outline:0; background:#0d1322;
                     color:var(--text); font:inherit; font-size:13px; padding:10px 12px; }
  #inputs textarea + textarea { border-left:1px solid var(--line); }
  #view { flex:1; overflow:auto; font-size:13px; line-height:1.5; }
  table { border-collapse:collapse; width:100%; }
  td { padding:0 8px; vertical-align:top; white-space:pre-wrap; word-break:break-all; }
  td.ln { color:#454f6e; text-align:right; user-select:none; width:1%; font-size:11px; padding-top:2px; }
  td.half { width:49%; }
  tr.del td.half.l { background:rgba(255,90,122,.12); }
  tr.add td.half.r { background:rgba(57,255,156,.1); }
  tr.chg td.half.l { background:rgba(255,90,122,.12); }
  tr.chg td.half.r { background:rgba(57,255,156,.1); }
  mark.d { background:rgba(255,90,122,.45); color:#fff; border-radius:2px; }
  mark.a { background:rgba(57,255,156,.4); color:#fff; border-radius:2px; }
  td.empty { background:rgba(255,255,255,.02); }
</style>
<meta property="og:title" content="Diff Deck">
<meta property="og:description" content="Side-by-side text diff with character-level inline highlights. Paste, compare, done.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rajeshrenato.github.io/playground/diff-deck/">
<meta property="og:image" content="https://rajeshrenato.github.io/playground/diff-deck/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="Side-by-side text diff with character-level inline highlights. Paste, compare, done.">
</head>
<body>
<header>
  <a class="back" href="../">&larr;</a>
  <h1>DIFF DECK</h1>
  <button id="bSample">Sample</button>
  <button id="bSwap">⇄ swap</button>
  <button id="bClear">Clear</button>
  <span id="stats"></span>
</header>
<div id="inputs">
  <textarea id="ta" spellcheck="false" placeholder="original text…"></textarea>
  <textarea id="tb" spellcheck="false" placeholder="changed text…"></textarea>
</div>
<div id="view"><table id="tbl"></table></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const MAXL = 1500;

function diffLines(aText, bText) {
  const a = aText.split('\n').slice(0, MAXL);
  const b = bText.split('\n').slice(0, MAXL);
  const n = a.length, m = b.length;
  const dp = [];
  for (let i = 0; i <= n; i++) dp.push(new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--)
    for (let j = m - 1; j >= 0; j--)
      dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ops = [];
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { ops.push({ t: 'same', a: a[i] }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ t: 'del', a: a[i] }); i++; }
    else { ops.push({ t: 'add', b: b[j] }); j++; }
  }
  while (i < n) { ops.push({ t: 'del', a: a[i++] }); }
  while (j < m) { ops.push({ t: 'add', b: b[j++] }); }
  return ops;
}

// common prefix/suffix lengths for inline char highlighting
function charSpan(x, y) {
  let p = 0;
  while (p < x.length && p < y.length && x[p] === y[p]) p++;
  let s = 0;
  while (s < x.length - p && s < y.length - p && x[x.length - 1 - s] === y[y.length - 1 - s]) s++;
  return { p, s };
}

function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function inlineHtml(x, y) {
  const { p, s } = charSpan(x, y);
  return {
    l: esc(x.slice(0, p)) + '<mark class="d">' + esc(x.slice(p, x.length - s)) + '</mark>' + esc(x.slice(x.length - s)),
    r: esc(y.slice(0, p)) + '<mark class="a">' + esc(y.slice(p, y.length - s)) + '</mark>' + esc(y.slice(y.length - s)),
  };
}

function render() {
  const ops = diffLines($('ta').value, $('tb').value);
  let html = '', la = 0, lb = 0, adds = 0, dels = 0;
  // group del-runs followed by add-runs so changed lines pair up
  for (let k = 0; k < ops.length;) {
    if (ops[k].t === 'same') {
      la++; lb++;
      html += '<tr><td class="ln">' + la + '</td><td class="half l">' + esc(ops[k].a) +
              '</td><td class="ln">' + lb + '</td><td class="half r">' + esc(ops[k].a) + '</td></tr>';
      k++;
      continue;
    }
    const delBlock = [], addBlock = [];
    while (k < ops.length && ops[k].t === 'del') delBlock.push(ops[k++].a);
    while (k < ops.length && ops[k].t === 'add') addBlock.push(ops[k++].b);
    dels += delBlock.length; adds += addBlock.length;
    const rows = Math.max(delBlock.length, addBlock.length);
    for (let r = 0; r < rows; r++) {
      const hasL = r < delBlock.length, hasR = r < addBlock.length;
      let lh = hasL ? esc(delBlock[r]) : '', rh = hasR ? esc(addBlock[r]) : '';
      if (hasL && hasR) { const io = inlineHtml(delBlock[r], addBlock[r]); lh = io.l; rh = io.r; }
      if (hasL) la++;
      if (hasR) lb++;
      html += '<tr class="' + (hasL && hasR ? 'chg' : hasL ? 'del' : 'add') + '">' +
        '<td class="ln">' + (hasL ? la : '') + '</td><td class="half l' + (hasL ? '' : ' empty') + '">' + lh + '</td>' +
        '<td class="ln">' + (hasR ? lb : '') + '</td><td class="half r' + (hasR ? '' : ' empty') + '">' + rh + '</td></tr>';
    }
  }
  $('tbl').innerHTML = html;
  $('stats').innerHTML = '<span class="add">+' + adds + '</span> <span class="del">−' + dels + '</span> lines';
  try { localStorage.setItem('dd_a', $('ta').value); localStorage.setItem('dd_b', $('tb').value); } catch (e) { }
}

let deb;
function queue() { clearTimeout(deb); deb = setTimeout(render, 200); }
$('ta').addEventListener('input', queue);
$('tb').addEventListener('input', queue);
$('bSwap').addEventListener('click', () => {
  const t = $('ta').value;
  $('ta').value = $('tb').value;
  $('tb').value = t;
  render();
});
$('bClear').addEventListener('click', () => { $('ta').value = ''; $('tb').value = ''; render(); });
$('bSample').addEventListener('click', () => {
  $('ta').value = 'function greet(name) {\n  const msg = "Hello " + name;\n  console.log(msg);\n  return msg;\n}\n\nconst users = ["ana", "bo"];\nusers.forEach(greet);';
  $('tb').value = 'function greet(name, loud) {\n  let msg = "Hello " + name;\n  if (loud) msg = msg.toUpperCase();\n  console.log(msg);\n  return msg;\n}\n\nconst users = ["ana", "bo", "chen"];\nusers.forEach(u => greet(u, true));';
  render();
});

$('ta').value = localStorage.getItem('dd_a') || '';
$('tb').value = localStorage.getItem('dd_b') || '';
if (!$('ta').value && !$('tb').value) $('bSample').click();
else render();
</script>
</body>
</html>
