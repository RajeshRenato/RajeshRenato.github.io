<body>
<a class="back" href="../">&larr; all projects</a>
<canvas id="game"></canvas>
<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
addEventListener('resize', resize);
resize();

let best = 0;
try { best = +(localStorage.getItem('tpl_best') || 0); } catch (e) { }
function saveBest(v) {
  best = Math.max(best, v);
  try { localStorage.setItem('tpl_best', best); } catch (e) { }
}

// keyboard and touch feed the same input state
const input = { left: false, right: false };
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') input.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') input.right = true;
});
addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') input.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') input.right = false;
});
canvas.addEventListener('pointerdown', e => {
  if (e.clientX < W / 2) input.left = true; else input.right = true;
});
addEventListener('pointerup', () => { input.left = input.right = false; });

const player = { x: 0.5 };
let time = 0;

function update(dt) {
  time += dt;
  if (input.left) player.x -= dt * 0.6;
  if (input.right) player.x += dt * 0.6;
  player.x = Math.max(0.05, Math.min(0.95, player.x));
  saveBest(Math.floor(time));
}

function draw() {
  ctx.fillStyle = '#141416';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#28e0ff';
  ctx.fillRect(player.x * W - 20, H * 0.7, 40, 40);
  ctx.fillStyle = '#96968e';
  ctx.font = '14px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Arrow keys or tap the left/right half. Best: ' + best + 's', W / 2, H * 0.9);
}

let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(0.033, (now - last) / 1000));
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
