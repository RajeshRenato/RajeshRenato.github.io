<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ffd166'/%3E%3Ctext x='16' y='23' font-family='Arial,Helvetica,sans-serif' font-weight='800' font-size='20' text-anchor='middle' fill='%2316160f'%3EC%3C/text%3E%3C/svg%3E">

<title>Cron Sage</title>
<style>
  :root { --bg:#0b0e16; --panel:#121726; --line:#232c45; --text:#dde4f5; --dim:#7684a8; --gold:#ffd166; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         background:var(--bg); color:var(--text); font-family:ui-monospace,'Cascadia Code','Courier New',monospace;
         padding:50px 16px; }
  a.back { position:fixed; top:12px; left:14px; color:var(--dim); font-size:12px; text-decoration:none; }
  h1 { font-size:18px; letter-spacing:4px; color:var(--gold); margin:0 0 20px; text-shadow:0 0 14px rgba(255,209,102,.5); }
  #expr { width:min(520px,94vw); background:var(--panel); color:var(--gold); border:1px solid var(--line);
          border-radius:10px; padding:16px 18px; font:inherit; font-size:24px; text-align:center;
          letter-spacing:4px; outline:none; }
  #expr:focus { border-color:var(--gold); }
  #fields { display:flex; gap:4px; width:min(520px,94vw); justify-content:space-around; margin:8px 0 18px;
            font-size:10px; color:#454f6e; letter-spacing:1px; }
  #desc { font-size:17px; color:#8affc9; min-height:26px; text-align:center; max-width:560px; margin-bottom:6px; }
  #err { color:#ff5a7a; font-size:13px; min-height:20px; margin-bottom:14px; }
  #next { width:min(520px,94vw); border-collapse:collapse; font-size:14px; }
  #next td { padding:8px 12px; border-bottom:1px solid var(--line); }
  #next td:first-child { color:var(--dim); width:40px; }
  #next td:last-child { text-align:right; color:var(--dim); font-size:12px; }
  h2 { font-size:11px; letter-spacing:2px; color:var(--dim); font-weight:400; margin:26px 0 8px; }
  #presets { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:640px; }
  #presets button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:16px;
                    padding:6px 14px; font:inherit; font-size:12px; cursor:pointer; }
  #presets button:hover { border-color:var(--gold); color:var(--gold); }
</style>
<meta property="og:title" content="Cron Sage">
<meta property="og:description" content="Cron expressions explained in plain English, with the next six run times counted down.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rajeshrenato.github.io/playground/cron-sage/">
<meta property="og:image" content="https://rajeshrenato.github.io/playground/cron-sage/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="Cron expressions explained in plain English, with the next six run times counted down.">
</head>
<body>
<a class="back" href="../">&larr; all projects</a>
<h1>CRON SAGE</h1>
<input id="expr" spellcheck="false" value="*/15 9-17 * * 1-5">
<div id="fields"><span>minute</span><span>hour</span><span>day of month</span><span>month</span><span>weekday</span></div>
<div id="desc"></div>
<div id="err"></div>
<table id="next"></table>
<h2>PRESETS</h2>
<div id="presets"></div>
<script>
'use strict';
const $ = id => document.getElementById(id);

const MONTHS = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12 };
const DOWS = { sun:0, mon:1, tue:2, wed:3, thu:4, fri:5, sat:6 };
const DOW_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MON_NAMES = ['','January','February','March','April','May','June','July','August','September','October','November','December'];

function parseField(f, min, max, names) {
  const set = new Set();
  for (const part of f.split(',')) {
    let m;
    if (part === '*') { for (let v = min; v <= max; v++) set.add(v); continue; }
    if ((m = /^\*\/(\d+)$/.exec(part))) {
      const st = +m[1];
      if (!st) return null;
      for (let v = min; v <= max; v += st) set.add(v);
      continue;
    }
    const conv = s => {
      if (/^\d+$/.test(s)) return +s;
      const k = s.toLowerCase().slice(0, 3);
      return names && k in names ? names[k] : NaN;
    };
    if ((m = /^([a-z0-9]+)-([a-z0-9]+)(?:\/(\d+))?$/i.exec(part))) {
      const a = conv(m[1]), b = conv(m[2]), st = m[3] ? +m[3] : 1;
      if (isNaN(a) || isNaN(b) || a < min || b > max || a > b || !st) return null;
      for (let v = a; v <= b; v += st) set.add(v);
      continue;
    }
    const v = conv(part);
    if (isNaN(v) || v < min || v > max) return null;
    set.add(v);
  }
  return set.size ? set : null;
}

function parseCron(str) {
  const f = str.trim().split(/\s+/);
  if (f.length !== 5) return { error: 'expected 5 fields: minute hour day-of-month month weekday' };
  const minute = parseField(f[0], 0, 59);
  const hour = parseField(f[1], 0, 23);
  const dom = parseField(f[2], 1, 31);
  const mon = parseField(f[3], 1, 12, MONTHS);
  const dow = parseField(f[4], 0, 7, DOWS);
  const names = ['minute', 'hour', 'day-of-month', 'month', 'weekday'];
  const vals = [minute, hour, dom, mon, dow];
  for (let i = 0; i < 5; i++) if (!vals[i]) return { error: 'invalid ' + names[i] + ' field: "' + f[i] + '"' };
  if (dow.has(7)) { dow.add(0); dow.delete(7); }
  return { minute, hour, dom, mon, dow, domStar: f[2] === '*', dowStar: f[4] === '*' };
}

function cronMatch(c, d) {
  if (!c.minute.has(d.getMinutes())) return false;
  if (!c.hour.has(d.getHours())) return false;
  if (!c.mon.has(d.getMonth() + 1)) return false;
  const domOk = c.dom.has(d.getDate()), dowOk = c.dow.has(d.getDay());
  if (c.domStar && c.dowStar) return true;
  if (c.domStar) return dowOk;
  if (c.dowStar) return domOk;
  return domOk || dowOk;   // standard cron OR quirk
}

function nextRuns(c, from, count) {
  const out = [];
  const d = new Date(from);
  d.setSeconds(0, 0);
  d.setMinutes(d.getMinutes() + 1);
  const limit = 2 * 366 * 24 * 60;
  for (let i = 0; i < limit && out.length < count; i++) {
    if (cronMatch(c, d)) out.push(new Date(d));
    d.setMinutes(d.getMinutes() + 1);
  }
  return out;
}

function listify(set, max, fmt) {
  const arr = [...set].sort((a, b) => a - b).map(fmt || (v => v));
  if (arr.length <= 6) return arr.join(', ');
  return arr.slice(0, 5).join(', ') + ' … +' + (arr.length - 5) + ' more';
}

function pad(n) { return String(n).padStart(2, '0'); }

function describe(c) {
  let time;
  if (c.minute.size === 60 && c.hour.size === 24) time = 'every minute';
  else if (c.minute.size === 1 && c.hour.size === 1)
    time = 'at ' + pad([...c.hour][0]) + ':' + pad([...c.minute][0]);
  else if (c.minute.size === 1 && c.hour.size === 24)
    time = 'at minute ' + [...c.minute][0] + ' of every hour';
  else if (c.hour.size === 24) time = 'at minutes ' + listify(c.minute) + ' of every hour';
  else time = 'at minute ' + listify(c.minute) + ' past hour ' + listify(c.hour);
  const parts = [time];
  if (!c.domStar) parts.push('on day ' + listify(c.dom) + ' of the month');
  if (!c.dowStar) parts.push((c.domStar ? 'on ' : 'or on ') + listify(c.dow, 7, v => DOW_NAMES[v]));
  if (c.mon.size !== 12) parts.push('in ' + listify(c.mon, 12, v => MON_NAMES[v]));
  return parts.join(' ');
}

function relTime(d) {
  const s = Math.round((d - Date.now()) / 1000);
  if (s < 90) return 'in ' + s + 's';
  if (s < 5400) return 'in ' + Math.round(s / 60) + ' min';
  if (s < 90000) return 'in ' + (s / 3600).toFixed(1) + ' h';
  return 'in ' + Math.round(s / 86400) + ' days';
}

function update() {
  const res = parseCron($('expr').value);
  if (res.error) {
    $('err').textContent = '✗ ' + res.error;
    $('desc').textContent = '';
    $('next').innerHTML = '';
    return;
  }
  $('err').textContent = '';
  $('desc').textContent = '“' + describe(res) + '”';
  const runs = nextRuns(res, new Date(), 6);
  $('next').innerHTML = runs.map((d, i) =>
    '<tr><td>#' + (i + 1) + '</td><td>' + d.toLocaleString(undefined, {
      weekday: 'short', year: 'numeric', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit'
    }) + '</td><td>' + relTime(d) + '</td></tr>').join('') ||
    '<tr><td colspan="3">no runs in the next 2 years</td></tr>';
}

const PRESETS = [
  ['* * * * *', 'every minute'],
  ['*/5 * * * *', 'every 5 min'],
  ['0 * * * *', 'hourly'],
  ['0 9 * * *', 'daily 9am'],
  ['0 9 * * 1-5', 'weekdays 9am'],
  ['0 0 * * 0', 'sunday midnight'],
  ['0 0 1 * *', 'monthly'],
  ['30 2 1 1,7 *', 'twice a year'],
];
for (const [ex, label] of PRESETS) {
  const b = document.createElement('button');
  b.textContent = label;
  b.title = ex;
  b.addEventListener('click', () => { $('expr').value = ex; update(); });
  $('presets').appendChild(b);
}

$('expr').addEventListener('input', update);
setInterval(update, 30000);   // keep "in X min" fresh
update();
</script>
</body>
</html>
