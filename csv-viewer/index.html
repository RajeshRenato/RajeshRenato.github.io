<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSV Viewer — parse · sort · filter · export</title>
<style>
  :root { --bg:#0b0e16; --panel:#121726; --line:#232c45; --text:#dde4f5; --dim:#7684a8; --green:#64ffb4; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text);
         font-family:ui-monospace,'Cascadia Code','Courier New',monospace; }
  header { display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header a.back { color:var(--dim); font-size:12px; text-decoration:none; }
  header h1 { font-size:15px; margin:0 10px 0 0; color:var(--green); letter-spacing:2px; }
  button, label.filebtn { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px;
           padding:6px 12px; font:inherit; font-size:13px; cursor:pointer; }
  button:hover, label.filebtn:hover { border-color:var(--green); color:var(--green); }
  input[type=file] { display:none; }
  #filter { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px;
            padding:6px 10px; font:inherit; font-size:13px; width:180px; outline:none; }
  label.chk { display:flex; gap:6px; align-items:center; font-size:12px; color:var(--dim); cursor:pointer; }
  #stats { margin-left:auto; color:var(--dim); font-size:12px; }
  #paste { height:110px; resize:vertical; border:0; border-bottom:1px solid var(--line); outline:0;
           background:#0d1322; color:var(--text); font:inherit; font-size:13px; padding:10px 14px; }
  #tblWrap { flex:1; overflow:auto; }
  table { border-collapse:collapse; font-size:13px; min-width:100%; }
  th { position:sticky; top:0; background:#1a2138; color:var(--green); padding:7px 12px; text-align:left;
       cursor:pointer; user-select:none; white-space:nowrap; border-bottom:2px solid var(--line); }
  th:hover { background:#232c4c; }
  td { padding:5px 12px; border-bottom:1px solid #1a2032; white-space:nowrap; max-width:360px;
       overflow:hidden; text-overflow:ellipsis; }
  tr:hover td { background:#141a2c; }
  #note { padding:6px 14px; color:var(--dim); font-size:12px; }
</style>
<meta property="og:title" content="CSV VIEWER — browser game">
<meta property="og:description" content="Paste or open CSV/TSV → sortable, filterable table with JSON export. Handles quoted fields.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rajeshrenato.github.io/playground/csv-viewer/">
<meta property="og:image" content="https://rajeshrenato.github.io/playground/csv-viewer/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="Paste or open CSV/TSV → sortable, filterable table with JSON export. Handles quoted fields.">
</head>
<body>
<header>
  <a class="back" href="../">&larr;</a>
  <h1>CSV VIEWER</h1>
  <label class="filebtn">Open file<input type="file" id="file" accept=".csv,.tsv,.txt"></label>
  <button id="bSample">Sample</button>
  <label class="chk"><input type="checkbox" id="hdr" checked> first row = header</label>
  <input id="filter" placeholder="filter rows…">
  <button id="bJson">Copy JSON</button>
  <button id="bDlJson">Download JSON</button>
  <span id="stats"></span>
</header>
<textarea id="paste" spellcheck="false" placeholder="paste CSV / TSV here (quotes, commas and newlines inside quotes all handled) — or open a file"></textarea>
<div id="tblWrap"><table id="tbl"></table></div>
<div id="note"></div>
<script>
'use strict';
const $ = id => document.getElementById(id);

function parseCSV(text, delim) {
  const rows = [];
  let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else q = false;
      } else field += ch;
    } else {
      if (ch === '"') q = true;
      else if (ch === delim) { row.push(field); field = ''; }
      else if (ch === '\n') { row.push(field); field = ''; rows.push(row); row = []; }
      else if (ch === '\r') { /* ignore */ }
      else field += ch;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => !(r.length === 1 && r[0] === ''));
}

function detectDelim(text) {
  const line = text.slice(0, text.indexOf('\n') > -1 ? text.indexOf('\n') : text.length);
  const cands = [',', ';', '\t', '|'];
  let bestD = ',', bestN = -1;
  for (const d of cands) {
    const n = line.split(d).length - 1;
    if (n > bestN) { bestN = n; bestD = d; }
  }
  return bestD;
}

let header = [], rows = [], view = [], sortCol = -1, sortAsc = true;

function load(text) {
  const delim = detectDelim(text);
  const all = parseCSV(text, delim);
  if (!all.length) { header = []; rows = []; render(); return; }
  const width = Math.max(...all.map(r => r.length));
  all.forEach(r => { while (r.length < width) r.push(''); });
  if ($('hdr').checked && all.length > 1) {
    header = all[0].map((h, i) => h || 'col' + (i + 1));
    rows = all.slice(1);
  } else {
    header = all[0].map((_, i) => 'col' + (i + 1));
    rows = all;
  }
  sortCol = -1;
  applyView();
}

function applyView() {
  const f = $('filter').value.toLowerCase();
  view = f ? rows.filter(r => r.some(c => c.toLowerCase().includes(f))) : rows.slice();
  if (sortCol >= 0) {
    const numeric = view.length > 0 && view.every(r => r[sortCol] === '' || !isNaN(parseFloat(r[sortCol])));
    view.sort((a, b) => {
      const x = a[sortCol], y = b[sortCol];
      const cmp = numeric ? (parseFloat(x) || 0) - (parseFloat(y) || 0) : String(x).localeCompare(String(y));
      return sortAsc ? cmp : -cmp;
    });
  }
  render();
}

const CAP = 2000;
function render() {
  const t = $('tbl');
  if (!header.length) {
    t.innerHTML = '';
    $('stats').textContent = '';
    $('note').textContent = '';
    return;
  }
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  let html = '<thead><tr>' + header.map((h, i) =>
    '<th data-i="' + i + '">' + esc(h) + (i === sortCol ? (sortAsc ? ' ▲' : ' ▼') : '') + '</th>').join('') + '</tr></thead><tbody>';
  const shown = view.slice(0, CAP);
  for (const r of shown)
    html += '<tr>' + r.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>';
  html += '</tbody>';
  t.innerHTML = html;
  t.querySelectorAll('th').forEach(th => th.addEventListener('click', () => {
    const i = +th.dataset.i;
    if (sortCol === i) sortAsc = !sortAsc;
    else { sortCol = i; sortAsc = true; }
    applyView();
  }));
  $('stats').textContent = view.length + ' / ' + rows.length + ' rows · ' + header.length + ' cols';
  $('note').textContent = view.length > CAP ? 'showing first ' + CAP + ' rows of ' + view.length : '';
}

function toJSON() {
  return JSON.stringify(view.map(r => {
    const o = {};
    header.forEach((h, i) => o[h] = r[i]);
    return o;
  }), null, 2);
}

const SAMPLE = 'name,role,city,deals,revenue\n"Priya S","AE, Enterprise",Chennai,14,86000\nMarcus L,SDR,Austin,3,4100\n"Lee, Jordan",AE,London,9,51200\nSana K,"Manager\n(Sales)",Dubai,11,70300\nDiego R,SDR,Bogotá,5,8800';

$('paste').addEventListener('input', () => load($('paste').value));
$('hdr').addEventListener('change', () => load($('paste').value));
$('filter').addEventListener('input', applyView);
$('bSample').addEventListener('click', () => { $('paste').value = SAMPLE; load(SAMPLE); });
$('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { $('paste').value = rd.result; load(rd.result); };
  rd.readAsText(f);
});
$('bJson').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(toJSON()); $('stats').textContent = 'JSON copied ✓'; }
  catch (e) { $('stats').textContent = 'copy blocked'; }
});
$('bDlJson').addEventListener('click', () => {
  const blob = new Blob([toJSON()], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'data.json';
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
