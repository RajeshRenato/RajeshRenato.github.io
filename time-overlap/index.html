<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2339ff9c'/%3E%3Ctext x='16' y='23' font-family='Arial,Helvetica,sans-serif' font-weight='800' font-size='20' text-anchor='middle' fill='%2316160f'%3ET%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>TIME OVERLAP — timezone meeting planner</title>
<style>
  :root { --bg:#0b0e16; --panel:#121726; --line:#232c45; --text:#dde4f5; --dim:#7684a8; --green:#39ff9c; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         background:var(--bg); color:var(--text); font-family:ui-monospace,'Cascadia Code','Courier New',monospace;
         padding:40px 14px; }
  a.back { position:fixed; top:12px; left:14px; color:var(--dim); font-size:12px; text-decoration:none; }
  h1 { font-size:18px; letter-spacing:4px; color:var(--green); margin:0 0 6px; text-shadow:0 0 14px rgba(57,255,156,.5); }
  #sub { color:var(--dim); font-size:12px; margin-bottom:20px; }
  #adder { display:flex; gap:8px; margin-bottom:18px; }
  select, button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px;
                   padding:7px 12px; font:inherit; font-size:13px; cursor:pointer; }
  button:hover { border-color:var(--green); color:var(--green); }
  #grid { overflow-x:auto; max-width:96vw; }
  table { border-collapse:collapse; font-size:11px; }
  th, td { padding:0; }
  td.city { padding:4px 10px; font-size:13px; white-space:nowrap; }
  td.city .now { color:var(--dim); font-size:11px; }
  td.city button { border:none; background:none; color:#55506e; cursor:pointer; padding:0 4px; font-size:13px; }
  .hr { width:30px; height:30px; text-align:center; vertical-align:middle; border:1px solid #0b0e16;
        color:rgba(255,255,255,.75); }
  .work { background:#0f5134; }
  .edge { background:#54431a; }
  .off  { background:#1a1530; color:rgba(255,255,255,.3); }
  .golden { outline:2px solid var(--green); outline-offset:-2px; }
  th.hl { color:var(--green); }
  th.colh { font-size:9px; color:#454f6e; font-weight:400; padding-bottom:3px; }
  #legend { margin-top:14px; font-size:11px; color:var(--dim); display:flex; gap:16px; }
  #legend i { display:inline-block; width:12px; height:12px; border-radius:2px; vertical-align:-2px; margin-right:4px; }
</style>
<meta property="og:title" content="TIME OVERLAP — browser game">
<meta property="og:description" content="Timezone meeting planner — see when everyone&#x27;s awake, with golden overlap hours highlighted.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://rajeshrenato.github.io/playground/time-overlap/">
<meta property="og:image" content="https://rajeshrenato.github.io/playground/time-overlap/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="Timezone meeting planner — see when everyone&#x27;s awake, with golden overlap hours highlighted.">
</head>
<body>
<a class="back" href="../">&larr; all projects</a>
<h1>TIME OVERLAP</h1>
<div id="sub">columns are hours of <b>your</b> day today — green-outlined columns work for everyone</div>
<div id="adder">
  <select id="citySel"></select>
  <button id="addBtn">+ add city</button>
</div>
<div id="grid"></div>
<div id="legend">
  <span><i style="background:#0f5134"></i>working 9–18</span>
  <span><i style="background:#54431a"></i>stretch 7–9 / 18–22</span>
  <span><i style="background:#1a1530"></i>asleep, probably</span>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);

const CITIES = [
  ['Chennai / Mumbai', 'Asia/Kolkata'], ['San Francisco', 'America/Los_Angeles'],
  ['New York', 'America/New_York'], ['Chicago', 'America/Chicago'], ['London', 'Europe/London'],
  ['Berlin / Paris', 'Europe/Berlin'], ['Helsinki', 'Europe/Helsinki'], ['Dubai', 'Asia/Dubai'],
  ['Singapore', 'Asia/Singapore'], ['Tokyo', 'Asia/Tokyo'], ['Seoul', 'Asia/Seoul'],
  ['Sydney', 'Australia/Sydney'], ['Auckland', 'Pacific/Auckland'], ['São Paulo', 'America/Sao_Paulo'],
  ['Mexico City', 'America/Mexico_City'], ['Toronto', 'America/Toronto'], ['Lagos', 'Africa/Lagos'],
  ['Nairobi', 'Africa/Nairobi'], ['Johannesburg', 'Africa/Johannesburg'], ['Tel Aviv', 'Asia/Jerusalem'],
  ['Istanbul', 'Europe/Istanbul'], ['Moscow', 'Europe/Moscow'], ['Karachi', 'Asia/Karachi'],
  ['Dhaka', 'Asia/Dhaka'], ['Jakarta', 'Asia/Jakarta'], ['Manila', 'Asia/Manila'],
  ['Hong Kong', 'Asia/Hong_Kong'], ['Denver', 'America/Denver'], ['Honolulu', 'Pacific/Honolulu'],
  ['Buenos Aires', 'America/Argentina/Buenos_Aires'],
];

function hourIn(tz, date) {
  return +new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', hourCycle: 'h23' }).format(date);
}
function timeIn(tz, date) {
  return new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(date);
}

// band: 2 = core working hours, 1 = stretch, 0 = off
function band(h) {
  if (h >= 9 && h < 18) return 2;
  if ((h >= 7 && h < 9) || (h >= 18 && h < 22)) return 1;
  return 0;
}

let rows = []; // [{name, tz}]
function save() { try { localStorage.setItem('to_rows', JSON.stringify(rows)); } catch (e) { } }
function load() {
  try {
    const r = JSON.parse(localStorage.getItem('to_rows') || 'null');
    if (Array.isArray(r) && r.length) { rows = r; return; }
  } catch (e) { }
  rows = [
    { name: 'Chennai / Mumbai', tz: 'Asia/Kolkata' },
    { name: 'San Francisco', tz: 'America/Los_Angeles' },
    { name: 'London', tz: 'Europe/London' },
  ];
}

function baseDates() {
  // a Date for each hour of *today* in the viewer's local time
  const out = [];
  const d0 = new Date();
  d0.setHours(0, 0, 0, 0);
  for (let h = 0; h < 24; h++) out.push(new Date(d0.getTime() + h * 3600000));
  return out;
}

function render() {
  const dates = baseDates();
  const nowH = new Date().getHours();
  const all = [{ name: 'You (local)', tz: Intl.DateTimeFormat().resolvedOptions().timeZone, you: true }, ...rows];
  // find golden columns: band === 2 for everyone
  const golden = dates.map(d => all.every(r => band(hourIn(r.tz, d)) === 2));
  let html = '<table><tr><th></th>' + dates.map((d, h) =>
    '<th class="colh' + (h === nowH ? ' hl' : '') + '">' + String(h).padStart(2, '0') + '</th>').join('') + '</tr>';
  all.forEach((r, ri) => {
    html += '<tr><td class="city">' + r.name +
      ' <span class="now">' + timeIn(r.tz, new Date()) + '</span>' +
      (r.you ? '' : ' <button data-del="' + (ri - 1) + '" title="remove">✕</button>') + '</td>';
    for (let h = 0; h < 24; h++) {
      const lh = hourIn(r.tz, dates[h]);
      const b = band(lh);
      html += '<td class="hr ' + (b === 2 ? 'work' : b === 1 ? 'edge' : 'off') +
        (golden[h] ? ' golden' : '') + '">' + lh + '</td>';
    }
    html += '</tr>';
  });
  html += '</table>';
  $('grid').innerHTML = html;
  document.querySelectorAll('[data-del]').forEach(b =>
    b.addEventListener('click', () => { rows.splice(+b.dataset.del, 1); save(); render(); }));
}

for (const [name, tz] of CITIES) {
  const o = document.createElement('option');
  o.value = tz;
  o.textContent = name;
  $('citySel').appendChild(o);
}
$('addBtn').addEventListener('click', () => {
  const sel = $('citySel');
  const name = sel.options[sel.selectedIndex].textContent;
  if (rows.length >= 8) return;
  if (rows.some(r => r.tz === sel.value)) return;
  rows.push({ name, tz: sel.value });
  save();
  render();
});

load();
render();
setInterval(render, 30000);
</script>
</body>
</html>
