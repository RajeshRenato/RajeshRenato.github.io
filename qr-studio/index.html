<style>
  :root { --paper:#f3f3ee; --ink:#1a1a18; --muted:#6e6e66; --rule:#dcdcd2; --card:#ffffff; --accent:#4f5bd5; --bad:#d8392f; }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#121214; --ink:#e8e8e2; --muted:#96968e; --rule:#2c2c30; --card:#1b1b1f; --accent:#7f8cff; --bad:#ff5a52; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:system-ui, -apple-system, 'Segoe UI', sans-serif;
         line-height:1.5; padding:48px 20px 64px; }
  main { max-width:980px; margin:0 auto; }
  a.back { position:fixed; top:12px; left:14px; color:var(--muted); font-size:13px; text-decoration:none; }
  a.back:hover { color:var(--ink); }
  h1 { margin:0 0 6px; font-size:34px; font-weight:800; }
  .lede { font-size:17px; margin:0 0 18px; }
  .grid { display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 380px); gap:22px; align-items:start; }
  @media (max-width:820px) { .grid { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1.5px solid var(--ink); border-radius:12px; padding:18px; }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .tabs button { font:inherit; font-size:14px; font-weight:600; padding:6px 12px; border-radius:999px; cursor:pointer;
                 border:1.5px solid var(--rule); background:transparent; color:var(--ink); }
  .tabs button.on { border-color:var(--ink); background:var(--ink); color:var(--paper); }
  label { display:block; font-weight:600; font-size:14px; margin:12px 0 5px; }
  input[type=text], input[type=password], input[type=tel], input[type=email], input[type=url], textarea, select {
    width:100%; font:inherit; font-size:15px; padding:9px 11px; border-radius:8px; border:1.5px solid var(--rule);
    background:var(--paper); color:var(--ink); }
  textarea { min-height:96px; resize:vertical; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .opts { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px; margin-top:6px; }
  input[type=color] { width:100%; height:38px; border:1.5px solid var(--rule); border-radius:8px; background:var(--paper); padding:3px; }
  .check { display:flex; align-items:center; gap:8px; font-weight:500; margin-top:12px; }
  .check input { width:18px; height:18px; }
  h2 { font-size:16px; margin:20px 0 4px; padding-top:14px; border-top:1px solid var(--rule); }
  .preview { display:flex; justify-content:center; padding:14px; background:var(--paper); border-radius:10px; }
  canvas#qr { width:100%; max-width:320px; height:auto; image-rendering:pixelated; border-radius:6px; }
  .info { font-size:13px; color:var(--muted); margin-top:10px; min-height:1.4em; }
  .warn { color:var(--bad); font-weight:600; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  button.act { font:inherit; font-weight:600; font-size:15px; padding:9px 14px; border-radius:8px; cursor:pointer;
               border:1.5px solid var(--ink); background:var(--card); color:var(--ink); }
  button.act:hover:not(:disabled) { background:var(--ink); color:var(--paper); }
  button.act:disabled { opacity:.4; cursor:default; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  [hidden] { display:none !important; }

<body>
<a class="back" href="../">&larr; all projects</a>
<main>
  <h1>QR Studio</h1>
  <p class="lede">QR codes for links, Wi-Fi, contacts, and more, with your own colors and logo. No watermark, no tracking, and the code points straight at your content.</p>
  <div class="grid">
    <div class="card">
      <div class="tabs" id="tabs">
        <button data-k="text" class="on">Link or text</button>
        <button data-k="wifi">Wi-Fi</button>
        <button data-k="contact">Contact</button>
        <button data-k="email">Email</button>
        <button data-k="sms">Text message</button>
        <button data-k="tel">Phone call</button>
      </div>
      <div data-form="text">
        <label for="f-text">Link or text</label>
        <textarea id="f-text">https://rajeshrenato.github.io/playground/</textarea>
      </div>
      <div data-form="wifi" hidden>
        <label for="f-ssid">Network name</label><input type="text" id="f-ssid" placeholder="Home Wi-Fi">
        <label for="f-wpw">Password</label><input type="text" id="f-wpw">
        <div class="two">
          <div><label for="f-sec">Security</label><select id="f-sec"><option value="WPA">WPA / WPA2 / WPA3</option><option value="WEP">WEP</option><option value="nopass">None</option></select></div>
          <div><label class="check" style="margin-top:36px"><input type="checkbox" id="f-hidden"> Hidden network</label></div>
        </div>
      </div>
      <div data-form="contact" hidden>
        <div class="two">
          <div><label for="f-first">First name</label><input type="text" id="f-first"></div>
          <div><label for="f-last">Last name</label><input type="text" id="f-last"></div>
        </div>
        <div class="two">
          <div><label for="f-phone">Phone</label><input type="tel" id="f-phone"></div>
          <div><label for="f-mail">Email</label><input type="email" id="f-mail"></div>
        </div>
        <div class="two">
          <div><label for="f-org">Company</label><input type="text" id="f-org"></div>
          <div><label for="f-url">Website</label><input type="url" id="f-url"></div>
        </div>
      </div>
      <div data-form="email" hidden>
        <label for="f-to">To</label><input type="email" id="f-to">
        <label for="f-subj">Subject</label><input type="text" id="f-subj">
        <label for="f-body">Message</label><textarea id="f-body"></textarea>
      </div>
      <div data-form="sms" hidden>
        <label for="f-smsto">Phone number</label><input type="tel" id="f-smsto">
        <label for="f-smsbody">Message</label><textarea id="f-smsbody"></textarea>
      </div>
      <div data-form="tel" hidden>
        <label for="f-tel">Phone number</label><input type="tel" id="f-tel">
      </div>

      <h2>Style</h2>
      <div class="opts">
        <div><label for="o-fg">Code color</label><input type="color" id="o-fg" value="#1a1a18"></div>
        <div><label for="o-bg">Background</label><input type="color" id="o-bg" value="#ffffff"></div>
        <div><label for="o-shape">Shape</label><select id="o-shape"><option value="square">Square</option><option value="rounded">Rounded</option><option value="dots">Dots</option></select></div>
        <div><label for="o-ecl">Error correction</label><select id="o-ecl"><option value="L">Low (7%)</option><option value="M" selected>Medium (15%)</option><option value="Q">High (25%)</option><option value="H">Highest (30%)</option></select></div>
      </div>
      <label for="o-logo">Logo in the middle <span style="font-weight:400" class="muted">(optional)</span></label>
      <div class="row" style="margin-top:0"><input type="file" id="o-logo" accept="image/*"><button class="act" id="o-nologo" hidden>Remove logo</button></div>
    </div>

    <div class="card">
      <div class="preview"><canvas id="qr" width="320" height="320"></canvas></div>
      <p class="info" id="info"></p>
      <div class="row">
        <select id="o-size" style="width:auto"><option value="512">512 px</option><option value="1024" selected>1024 px</option><option value="2048">2048 px</option></select>
        <button class="act" id="dlPng">Download PNG</button>
        <button class="act" id="dlSvg">Download SVG</button>
      </div>
      <p class="info">Test it with your phone's camera before printing. Dark code on a light background scans best.</p>
    </div>
  </div>
</main>
<script>
'use strict';
// QR encoder (ISO/IEC 18004) written from scratch: numeric, alphanumeric, and byte modes,
// versions 1 to 40, Reed-Solomon error correction, and penalty-based mask selection.

// tables indexed [level][version]; level order L, M, Q, H
const ECC_PER_BLOCK = [
  [-1, 7, 10, 15, 20, 26, 18, 20, 24, 30, 18, 20, 24, 26, 30, 22, 24, 28, 30, 28, 28, 28, 28, 30, 30, 26, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
  [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26, 26, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28, 28],
  [-1, 13, 22, 18, 26, 18, 24, 18, 22, 20, 24, 28, 26, 24, 20, 30, 24, 28, 28, 26, 30, 28, 30, 30, 30, 30, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
  [-1, 17, 28, 22, 16, 22, 28, 26, 26, 24, 28, 24, 28, 22, 24, 24, 30, 28, 28, 26, 28, 30, 24, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
];
const NUM_BLOCKS = [
  [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4, 4, 4, 4, 4, 6, 6, 6, 6, 7, 8, 8, 9, 9, 10, 12, 12, 12, 13, 14, 15, 16, 17, 18, 19, 19, 20, 21, 22, 24, 25],
  [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49],
  [-1, 1, 1, 2, 2, 4, 4, 6, 6, 8, 8, 8, 10, 12, 16, 12, 17, 16, 18, 21, 20, 23, 23, 25, 27, 29, 34, 34, 35, 38, 40, 43, 45, 48, 51, 53, 56, 59, 62, 65, 68],
  [-1, 1, 1, 2, 4, 4, 4, 5, 6, 8, 8, 11, 11, 16, 16, 18, 16, 19, 21, 25, 25, 25, 34, 30, 32, 35, 37, 40, 42, 45, 48, 51, 54, 57, 60, 63, 66, 70, 74, 77, 81],
];
const LEVELS = { L: 0, M: 1, Q: 2, H: 3 };
const FORMAT_BITS = [1, 0, 3, 2];
const ALNUM = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:';

function rawDataModules(ver) {
  let r = (16 * ver + 128) * ver + 64;
  if (ver >= 2) {
    const n = Math.floor(ver / 7) + 2;
    r -= (25 * n - 10) * n - 55;
    if (ver >= 7) r -= 36;
  }
  return r;
}
const dataCodewords = (ver, lvl) => Math.floor(rawDataModules(ver) / 8) - ECC_PER_BLOCK[lvl][ver] * NUM_BLOCKS[lvl][ver];

function alignmentPositions(ver) {
  if (ver === 1) return [];
  const n = Math.floor(ver / 7) + 2;
  const step = ver === 32 ? 26 : Math.ceil((ver * 4 + 4) / (n * 2 - 2)) * 2;
  const out = [6];
  for (let pos = ver * 4 + 10; out.length < n; pos -= step) out.splice(1, 0, pos);
  return out;
}

// GF(256) with the QR polynomial x^8 + x^4 + x^3 + x^2 + 1
function gfMul(a, b) {
  let z = 0;
  for (let i = 7; i >= 0; i--) {
    z = (z << 1) ^ ((z >>> 7) * 0x11d);
    z ^= ((b >>> i) & 1) * a;
  }
  return z;
}
function rsDivisor(degree) {
  const r = new Array(degree).fill(0);
  r[degree - 1] = 1;
  let root = 1;
  for (let i = 0; i < degree; i++) {
    for (let j = 0; j < r.length; j++) {
      r[j] = gfMul(r[j], root);
      if (j + 1 < r.length) r[j] ^= r[j + 1];
    }
    root = gfMul(root, 0x02);
  }
  return r;
}
function rsRemainder(data, divisor) {
  const r = divisor.map(() => 0);
  for (const b of data) {
    const factor = b ^ r.shift();
    r.push(0);
    divisor.forEach((coef, i) => { r[i] ^= gfMul(coef, factor); });
  }
  return r;
}

// segments
function utf8(text) { return Array.from(new TextEncoder().encode(text)); }
function pickMode(text) {
  if (/^[0-9]*$/.test(text)) return 'num';
  if ([...text].every(ch => ALNUM.includes(ch))) return 'alnum';
  return 'byte';
}
function countBits(mode, ver) {
  const g = ver <= 9 ? 0 : ver <= 26 ? 1 : 2;
  return { num: [10, 12, 14], alnum: [9, 11, 13], byte: [8, 16, 16] }[mode][g];
}
function segmentBits(text, mode) {
  const bits = [];
  const put = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >>> i) & 1); };
  if (mode === 'num') {
    for (let i = 0; i < text.length; i += 3) { const chunk = text.slice(i, i + 3); put(parseInt(chunk, 10), chunk.length * 3 + 1); }
    return { bits, count: text.length, put };
  }
  if (mode === 'alnum') {
    for (let i = 0; i + 1 < text.length; i += 2) put(ALNUM.indexOf(text[i]) * 45 + ALNUM.indexOf(text[i + 1]), 11);
    if (text.length % 2) put(ALNUM.indexOf(text[text.length - 1]), 6);
    return { bits, count: text.length };
  }
  const bytes = utf8(text);
  bytes.forEach(b => put(b, 8));
  return { bits, count: bytes.length };
}
const MODE_INDICATOR = { num: 1, alnum: 2, byte: 4 };

function encodeData(text, lvl, minVer) {
  const mode = pickMode(text);
  const seg = segmentBits(text, mode);
  for (let ver = minVer || 1; ver <= 40; ver++) {
    const capacity = dataCodewords(ver, lvl) * 8;
    const cb = countBits(mode, ver);
    if (seg.count >= 1 << cb) continue;
    const used = 4 + cb + seg.bits.length;
    if (used > capacity) continue;
    const bits = [];
    const put = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >>> i) & 1); };
    put(MODE_INDICATOR[mode], 4);
    put(seg.count, cb);
    bits.push(...seg.bits);
    put(0, Math.min(4, capacity - bits.length));
    put(0, (8 - bits.length % 8) % 8);
    const bytes = [];
    for (let i = 0; i < bits.length; i += 8) {
      let b = 0;
      for (let k = 0; k < 8; k++) b = (b << 1) | bits[i + k];
      bytes.push(b);
    }
    for (let pad = 0xec; bytes.length < capacity / 8; pad ^= 0xec ^ 0x11) bytes.push(pad);
    return { ver, mode, bytes };
  }
  return null;
}

function addEcc(bytes, ver, lvl) {
  const nBlocks = NUM_BLOCKS[lvl][ver], eccLen = ECC_PER_BLOCK[lvl][ver];
  const raw = Math.floor(rawDataModules(ver) / 8);
  const nShort = nBlocks - raw % nBlocks, shortLen = Math.floor(raw / nBlocks);
  const div = rsDivisor(eccLen);
  const blocks = [];
  for (let i = 0, k = 0; i < nBlocks; i++) {
    const dat = bytes.slice(k, k + shortLen - eccLen + (i < nShort ? 0 : 1));
    k += dat.length;
    const ecc = rsRemainder(dat, div);
    if (i < nShort) dat.push(null);
    blocks.push(dat.concat(ecc));
  }
  const out = [];
  for (let i = 0; i < blocks[0].length; i++) {
    blocks.forEach(b => { if (b[i] !== null) out.push(b[i]); });
  }
  return out;
}

const MASKS = [
  (x, y) => (x + y) % 2 === 0,
  (x, y) => y % 2 === 0,
  (x, y) => x % 3 === 0,
  (x, y) => (x + y) % 3 === 0,
  (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0,
  (x, y) => x * y % 2 + x * y % 3 === 0,
  (x, y) => (x * y % 2 + x * y % 3) % 2 === 0,
  (x, y) => ((x + y) % 2 + x * y % 3) % 2 === 0,
];

function buildMatrix(ver, lvl, codewords, mask) {
  const size = ver * 4 + 17;
  const m = Array.from({ length: size }, () => new Array(size).fill(false));
  const fn = Array.from({ length: size }, () => new Array(size).fill(false));
  const setF = (x, y, dark) => { m[y][x] = dark; fn[y][x] = true; };

  for (let i = 0; i < size; i++) { setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
  for (const [cx, cy] of [[3, 3], [size - 4, 3], [3, size - 4]]) {
    for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
      const x = cx + dx, y = cy + dy;
      if (x < 0 || y < 0 || x >= size || y >= size) continue;
      const d = Math.max(Math.abs(dx), Math.abs(dy));
      setF(x, y, d !== 2 && d !== 4);
    }
  }
  const al = alignmentPositions(ver), n = al.length;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    if ((i === 0 && j === 0) || (i === 0 && j === n - 1) || (i === n - 1 && j === 0)) continue;
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) setF(al[i] + dx, al[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
  }
  drawFormat(m, fn, lvl, mask, setF, size);
  if (ver >= 7) {
    let rem = ver;
    for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
    const bits = (ver << 12) | rem;
    for (let i = 0; i < 18; i++) {
      const dark = ((bits >>> i) & 1) === 1, a = size - 11 + i % 3, b = Math.floor(i / 3);
      setF(a, b, dark); setF(b, a, dark);
    }
  }

  let i = 0;
  for (let right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (let vert = 0; vert < size; vert++) {
      for (let j = 0; j < 2; j++) {
        const x = right - j, upward = ((right + 1) & 2) === 0, y = upward ? size - 1 - vert : vert;
        if (fn[y][x]) continue;
        if (i < codewords.length * 8) { m[y][x] = ((codewords[i >>> 3] >>> (7 - (i & 7))) & 1) === 1; i++; }
        if (MASKS[mask](x, y)) m[y][x] = !m[y][x];
      }
    }
  }
  return m;
}

function drawFormat(m, fn, lvl, mask, setF, size) {
  const data = (FORMAT_BITS[lvl] << 3) | mask;
  let rem = data;
  for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
  const bits = ((data << 10) | rem) ^ 0x5412;
  const bit = i => ((bits >>> i) & 1) === 1;
  for (let i = 0; i <= 5; i++) setF(8, i, bit(i));
  setF(8, 7, bit(6)); setF(8, 8, bit(7)); setF(7, 8, bit(8));
  for (let i = 9; i < 15; i++) setF(14 - i, 8, bit(i));
  for (let i = 0; i < 8; i++) setF(size - 1 - i, 8, bit(i));
  for (let i = 8; i < 15; i++) setF(8, size - 15 + i, bit(i));
  setF(8, size - 8, true);
}

function penalty(m) {
  const size = m.length;
  let score = 0, dark = 0;
  const lines = [];
  for (let y = 0; y < size; y++) { lines.push(m[y]); lines.push(m.map(row => row[y])); }
  for (const line of lines) {
    let run = 1;
    for (let i = 1; i <= size; i++) {
      if (i < size && line[i] === line[i - 1]) run++;
      else { if (run >= 5) score += 3 + run - 5; run = 1; }
    }
    for (let i = 0; i + 10 < size; i++) {
      const s = line.slice(i, i + 11).map(v => (v ? 1 : 0)).join('');
      if (s === '10111010000' || s === '00001011101') score += 40;
    }
  }
  for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) {
    const c = m[y][x];
    if (c === m[y][x + 1] && c === m[y + 1][x] && c === m[y + 1][x + 1]) score += 3;
  }
  for (const row of m) for (const v of row) if (v) dark++;
  score += Math.floor(Math.abs(dark * 100 / (size * size) - 50) / 5) * 10;
  return score;
}

// returns { size, modules, ver, level, mode } or null when the text doesn't fit
function makeQR(text, level, opts = {}) {
  const lvl = LEVELS[level];
  const enc = encodeData(text, lvl, opts.minVer);
  if (!enc) return null;
  const codewords = addEcc(enc.bytes, enc.ver, lvl);
  let best = null, bestScore = Infinity;
  const masks = opts.mask === undefined ? [0, 1, 2, 3, 4, 5, 6, 7] : [opts.mask];
  for (const mask of masks) {
    const mat = buildMatrix(enc.ver, lvl, codewords, mask);
    const sc = penalty(mat);
    if (sc < bestScore) { bestScore = sc; best = { mat, mask }; }
  }
  return { size: best.mat.length, modules: best.mat, ver: enc.ver, level, mode: enc.mode, mask: best.mask };
}

// content builders
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/([\\;,:"])/g, '\\$1');
let kind = 'text';

function payload() {
  const v = id => $(id).value.trim();
  if (kind === 'text') return $('f-text').value;
  if (kind === 'wifi') {
    if (!v('f-ssid')) return '';
    const sec = $('f-sec').value;
    return 'WIFI:T:' + sec + ';S:' + esc(v('f-ssid')) + ';' + (sec === 'nopass' ? '' : 'P:' + esc($('f-wpw').value) + ';') +
      ($('f-hidden').checked ? 'H:true;' : '') + ';';
  }
  if (kind === 'contact') {
    const first = v('f-first'), last = v('f-last');
    if (!first && !last && !v('f-phone') && !v('f-mail')) return '';
    const lines = ['BEGIN:VCARD', 'VERSION:3.0', 'N:' + last + ';' + first + ';;;', 'FN:' + [first, last].filter(Boolean).join(' ')];
    if (v('f-org')) lines.push('ORG:' + v('f-org'));
    if (v('f-phone')) lines.push('TEL:' + v('f-phone'));
    if (v('f-mail')) lines.push('EMAIL:' + v('f-mail'));
    if (v('f-url')) lines.push('URL:' + v('f-url'));
    lines.push('END:VCARD');
    return lines.join('\n');
  }
  if (kind === 'email') {
    if (!v('f-to')) return '';
    const q = [];
    if (v('f-subj')) q.push('subject=' + encodeURIComponent(v('f-subj')));
    if ($('f-body').value) q.push('body=' + encodeURIComponent($('f-body').value));
    return 'mailto:' + v('f-to') + (q.length ? '?' + q.join('&') : '');
  }
  if (kind === 'sms') return v('f-smsto') ? 'SMSTO:' + v('f-smsto') + ':' + $('f-smsbody').value : '';
  if (kind === 'tel') return v('f-tel') ? 'tel:' + v('f-tel').replace(/\s+/g, '') : '';
  return '';
}

// rendering
let logo = null, current = null;

function luminance(hex) {
  const c = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255).map(v => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)));
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}

function isFinder(qr, x, y) {
  const s = qr.size;
  return (x < 7 && y < 7) || (x >= s - 7 && y < 7) || (x < 7 && y >= s - 7);
}

function paint(ctx, qr, px, fg, bg, shape) {
  const quiet = 4, n = qr.size + quiet * 2, cell = px / n;
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, px, px);
  ctx.fillStyle = fg;
  for (let y = 0; y < qr.size; y++) for (let x = 0; x < qr.size; x++) {
    if (!qr.modules[y][x]) continue;
    const X = (x + quiet) * cell, Y = (y + quiet) * cell;
    if (shape === 'square' || isFinder(qr, x, y)) { ctx.fillRect(X, Y, cell + 0.5, cell + 0.5); continue; }
    ctx.beginPath();
    if (shape === 'dots') ctx.arc(X + cell / 2, Y + cell / 2, cell * 0.42, 0, Math.PI * 2);
    else ctx.roundRect(X + cell * 0.05, Y + cell * 0.05, cell * 0.9, cell * 0.9, cell * 0.32);
    ctx.fill();
  }
  if (logo) {
    const box = px * 0.22, x0 = (px - box) / 2;
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.roundRect(x0 - cell, x0 - cell, box + cell * 2, box + cell * 2, cell * 1.5); ctx.fill();
    const r = Math.min(box / logo.width, box / logo.height);
    ctx.drawImage(logo, (px - logo.width * r) / 2, (px - logo.height * r) / 2, logo.width * r, logo.height * r);
  }
}

function svgFor(qr, fg, bg, shape) {
  const quiet = 4, n = qr.size + quiet * 2;
  const parts = ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + n + ' ' + n + '" shape-rendering="' + (shape === 'square' ? 'crispEdges' : 'geometricPrecision') + '">',
    '<rect width="' + n + '" height="' + n + '" fill="' + bg + '"/>'];
  let path = '';
  const dots = [];
  for (let y = 0; y < qr.size; y++) for (let x = 0; x < qr.size; x++) {
    if (!qr.modules[y][x]) continue;
    const X = x + quiet, Y = y + quiet;
    if (shape === 'square' || isFinder(qr, x, y)) path += 'M' + X + ' ' + Y + 'h1v1h-1z';
    else if (shape === 'dots') dots.push('<circle cx="' + (X + 0.5) + '" cy="' + (Y + 0.5) + '" r="0.42"/>');
    else dots.push('<rect x="' + (X + 0.05) + '" y="' + (Y + 0.05) + '" width="0.9" height="0.9" rx="0.32"/>');
  }
  parts.push('<g fill="' + fg + '"><path d="' + path + '"/>' + dots.join('') + '</g>');
  if (logo && logo.src) {
    const box = n * 0.22, x0 = (n - box) / 2;
    parts.push('<rect x="' + (x0 - 1) + '" y="' + (x0 - 1) + '" width="' + (box + 2) + '" height="' + (box + 2) + '" rx="1.5" fill="' + bg + '"/>');
    parts.push('<image href="' + logo.src + '" x="' + x0 + '" y="' + x0 + '" width="' + box + '" height="' + box + '" preserveAspectRatio="xMidYMid meet"/>');
  }
  parts.push('</svg>');
  return parts.join('');
}

function render() {
  const text = payload();
  const fg = $('o-fg').value, bg = $('o-bg').value, shape = $('o-shape').value;
  let level = $('o-ecl').value;
  if (logo && level !== 'H') level = 'H';
  const canvas = $('qr'), ctx = canvas.getContext('2d');
  const notes = [];
  current = null;
  if (!text) {
    ctx.fillStyle = bg; ctx.fillRect(0, 0, canvas.width, canvas.height);
    $('info').textContent = 'Fill in the details to make a code.';
    setButtons(false);
    return;
  }
  const qr = makeQR(text, level);
  if (!qr) {
    $('info').innerHTML = '<span class="warn">Too much for one QR code.</span> Shorten the text or lower error correction.';
    setButtons(false);
    return;
  }
  current = { qr, fg, bg, shape };
  paint(ctx, qr, canvas.width, fg, bg, shape);
  notes.push(qr.size + '×' + qr.size + ' modules (version ' + qr.ver + '), error correction ' + level);
  if (logo && $('o-ecl').value !== 'H') notes.push('raised to Highest because of the logo');
  const lf = luminance(fg), lb = luminance(bg), ratio = (Math.max(lf, lb) + 0.05) / (Math.min(lf, lb) + 0.05);
  $('info').textContent = notes.join(', ') + '.';
  if (lf > lb) $('info').innerHTML += ' <span class="warn">Light code on a dark background confuses many scanners.</span>';
  else if (ratio < 4) $('info').innerHTML += ' <span class="warn">Low contrast; it may not scan.</span>';
  setButtons(true);
}

function setButtons(on) { $('dlPng').disabled = !on; $('dlSvg').disabled = !on; }

function download(href, name) {
  const a = document.createElement('a');
  a.href = href; a.download = name;
  a.click();
}

let timer = 0;
function schedule() { clearTimeout(timer); timer = setTimeout(render, 80); }

document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => {
  kind = b.dataset.k;
  document.querySelectorAll('#tabs button').forEach(o => o.classList.toggle('on', o === b));
  document.querySelectorAll('[data-form]').forEach(f => { f.hidden = f.dataset.form !== kind; });
  render();
}));
document.querySelectorAll('input, textarea, select').forEach(el => {
  if (el.id === 'o-logo' || el.id === 'o-size') return;
  el.addEventListener('input', schedule);
  el.addEventListener('change', schedule);
});
$('o-logo').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => { logo = img; $('o-nologo').hidden = false; render(); };
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
});
$('o-nologo').addEventListener('click', () => { logo = null; $('o-logo').value = ''; $('o-nologo').hidden = true; render(); });
$('dlPng').addEventListener('click', () => {
  if (!current) return;
  const px = +$('o-size').value, c = document.createElement('canvas');
  c.width = c.height = px;
  paint(c.getContext('2d'), current.qr, px, current.fg, current.bg, current.shape);
  download(c.toDataURL('image/png'), 'qr-code.png');
});
$('dlSvg').addEventListener('click', () => {
  if (!current) return;
  const blob = new Blob([svgFor(current.qr, current.fg, current.bg, current.shape)], { type: 'image/svg+xml' });
  download(URL.createObjectURL(blob), 'qr-code.svg');
});

render();
</script>
</body>
</html>
